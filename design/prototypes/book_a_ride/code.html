<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-16 px-margin-mobile w-full fixed top-0 z-50 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high dark:hover:bg-surface-variant rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">TriRide</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a friendly young male student with a bright smile, wearing a clean casual blue polo shirt. The background is a soft, out-of-focus university campus setting with warm afternoon sunlight filtering through trees. The overall aesthetic is clean, high-utility, and professional, consistent with a reliable transportation app profile." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgIOzfqVAHADbjAYgKqAkGDkalOdPpTG-Tj1j5E6KL46BJC03OSN4VCwqlB5u7fgFnAUweQtNg-0ESv5i31StXx14VAJogDlWa-iJs3mzDhxfBqWnuFTudqgow_Ipk5GG4xMvd5oPwne5_BBzHbrZ6nGUaq1r0OWsivPQzsZBRGaa-g9fZGjG9kM-DIV0dn70P-44B5KC2nAPa8S7L4V-dARFMj--3id_qjDyrqtE1v1YhKNknz0uRR9CazF5KFUZtGoTPTibmJaU">
</div>

<main class="pt-24 px-margin-mobile max-w-2xl mx-auto">
<!-- Map Preview (Contextual background) -->

<div class="w-full h-full bg-cover bg-center" data-alt="A clean, minimalist digital map interface showing a simplified urban street grid with soft gray and white tones. Subtle blue highlights indicate primary traffic routes. The lighting is even and clear, evoking a sense of modern logistics and precision. A small blue pulsing dot indicates the user's current location in a high-traffic student area." data-location="Manila" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAFvDQTIU1THyIW1pcbe8qKCUh1WDOQWZbOOpfNfocZuz_npJmgGF6hfMP-4yatqZ7GQ0Ncw44WiUF4KoWG0ZFIEOrTwHwVAWasH9xNtA5Mg7P3M9MVc8d_f_gRLL2fC8Q2Vv0ZMjjv7_nmeU_TcSESemJ-Mm_6D1so4HIS5l-tOicDaVMRE-lBmYdotaEaFcsW0JfGQ2vtzm7AsZ1HRfpYeBqluaOdXxP4fNsKtDsiy0x-hYhVxKu_cy-w4SxxfyMBgh9DXXIMeFs')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<!-- Booking Form -->
<section class="space-y-lg">
<!-- Location Inputs -->
<div class="bg-white p-md rounded-xl border border-outline-variant diffusion-shadow space-y-4">
<div class="relative">
<div class="absolute left-3 top-1/2 -translate-y-1/2 flex flex-col items-center gap-1">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<div class="w-[1px] h-8 bg-outline-variant"></div>
<span class="w-2 h-2 rounded-full border border-secondary bg-white"></span>
</div>
<div class="ml-8 space-y-3">
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="my_location">my_location</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-outline-variant rounded-xl focus:border-2 focus:border-primary-container focus:ring-0 font-body text-body outline-none transition-all" placeholder="Pickup Location" type="text" value="University East Gate">
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="location_on">location_on</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:border-2 focus:border-primary-container focus:ring-0 font-body text-body outline-none transition-all" placeholder="Where to?" type="text">
</div>
</div>
</div>
</div>
<!-- Time Toggle -->
<div class="flex p-1 bg-surface-container rounded-xl border border-outline-variant">
<button class="flex-1 py-2.5 rounded-lg font-button text-button transition-all bg-white text-primary shadow-sm" id="btn-now" onclick="toggleSchedule('now')">
                    Ride Now
                </button>
<button class="flex-1 py-2.5 rounded-lg font-button text-button transition-all text-on-surface-variant hover:bg-surface-container-high" id="btn-later" onclick="toggleSchedule('later')">
                    Schedule Later
                </button>
</div>
<!-- Schedule Picker (Hidden by default) -->
<div class="hidden animate-in fade-in slide-in-from-top-2 duration-300" id="schedule-picker">
<div class="flex gap-4">
<div class="flex-1 space-y-2">
<label class="font-caption text-caption text-outline ml-1">Date</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-xl font-body text-body focus:border-primary focus:ring-0" type="date">
</div>
<div class="flex-1 space-y-2">
<label class="font-caption text-caption text-outline ml-1">Time</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-xl font-body text-body focus:border-primary focus:ring-0" type="time">
</div>
</div>
</div>
<!-- Passenger Selector -->
<div class="space-y-3">
<h3 class="font-section-title text-section-title text-on-surface">Passengers</h3>
<div class="grid grid-cols-4 gap-3">
<button class="passenger-pill py-3 rounded-xl border border-outline-variant bg-white font-button text-button text-primary border-primary-container ring-1 ring-primary-container" data-val="1" onclick="selectPassenger(1)">1</button>
<button class="passenger-pill py-3 rounded-xl border border-outline-variant bg-white font-button text-button text-on-surface-variant" data-val="2" onclick="selectPassenger(2)">2</button>
<button class="passenger-pill py-3 rounded-xl border border-outline-variant bg-white font-button text-button text-on-surface-variant" data-val="3" onclick="selectPassenger(3)">3</button>
<button class="passenger-pill py-3 rounded-xl border border-outline-variant bg-white font-button text-button text-on-surface-variant" data-val="4" onclick="selectPassenger(4)">4</button>
</div>
</div>
<!-- Special Notes -->
<div class="space-y-3">
<h3 class="font-section-title text-section-title text-on-surface">Special Notes</h3>
<textarea class="w-full p-4 bg-white border border-outline-variant rounded-xl font-body text-body h-24 focus:border-primary focus:ring-0 transition-all custom-scrollbar resize-none" placeholder="e.g. Near the blue gate, carrying a large bag..."></textarea>
</div>
</section>
</main>
<!-- Bottom Summary Card -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t border-outline-variant p-margin-mobile pb-10 z-40 diffusion-shadow">
<div class="max-w-2xl mx-auto flex flex-col gap-4">
<div class="flex justify-between items-center">

<div class="flex items-center gap-2 bg-secondary/10 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="verified">verified</span>
<span class="font-caption text-caption text-secondary font-medium">Safe Ride</span>
</div>
</div>
<button class="w-full bg-primary-container text-white py-4 rounded-xl font-button text-button hover:bg-primary transition-all active:scale-[0.98] shadow-md">Confirm Booking</button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full h-[64px] z-50 flex justify-around items-center bg-surface dark:bg-inverse-surface px-margin-mobile border-t border-outline-variant dark:border-outline shadow-lg md:hidden">
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-highest transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-nav-label text-nav-label">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-primary dark:text-inverse-primary font-bold hover:bg-surface-container-highest transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
<span class="font-nav-label text-nav-label">Bookings</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-highest transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
<span class="font-nav-label text-nav-label">Messages</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-highest transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-nav-label text-nav-label">Profile</span>
</div>
</nav>
<script>
        function toggleSchedule(mode) {
            const btnNow = document.getElementById('btn-now');
            const btnLater = document.getElementById('btn-later');
            const picker = document.getElementById('schedule-picker');

            if (mode === 'now') {
                btnNow.classList.add('bg-white', 'text-primary', 'shadow-sm');
                btnNow.classList.remove('text-on-surface-variant');
                btnLater.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                btnLater.classList.add('text-on-surface-variant');
                picker.classList.add('hidden');
            } else {
                btnLater.classList.add('bg-white', 'text-primary', 'shadow-sm');
                btnLater.classList.remove('text-on-surface-variant');
                btnNow.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                btnNow.classList.add('text-on-surface-variant');
                picker.classList.remove('hidden');
            }
        }

        function selectPassenger(num) {
            const buttons = document.querySelectorAll('.passenger-pill');
            buttons.forEach(btn => {
                if (parseInt(btn.getAttribute('data-val')) === num) {
                    btn.classList.add('text-primary', 'border-primary-container', 'ring-1', 'ring-primary-container');
                    btn.classList.remove('text-on-surface-variant');
                } else {
                    btn.classList.remove('text-primary', 'border-primary-container', 'ring-1', 'ring-primary-container');
                    btn.classList.add('text-on-surface-variant');
                }
            });
        }
    </script>
