<button class="h-14 rounded-xl bg-primary text-on-primary font-button flex items-center justify-center gap-2 active:scale-[0.98] transition-all diffusion-shadow" id="mainActionButton" onclick="toggleTripState()">

<!-- Success Toast (Hidden by default) -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-secondary text-on-secondary px-6 py-3 rounded-full diffusion-shadow flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300" id="statusToast">
<span class="material-symbols-outlined">check_circle</span>
<span class="font-bold">Trip Started Successfully</span>
</div>
<script>
        let isTripStarted = false;

        function toggleTripState() {
            const btn = document.getElementById('mainActionButton');
            const icon = document.getElementById('actionIcon');
            const text = document.getElementById('actionText');
            const toast = document.getElementById('statusToast');

            if (!isTripStarted) {
                // Change to Complete state
                isTripStarted = true;
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
                icon.textContent = 'check';
                text.textContent = 'Complete Trip';
                
                // Show toast
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('translate-y-2');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                    toast.classList.remove('translate-y-2');
                }, 3000);
            } else {
                // Logic for trip completion would go here (redirect, etc)
                alert('Trip completed! Calculating fare...');
                location.reload();
            }
        }

        // Simple interaction for the bottom sheet
        let startY = 0;
        const card = document.getElementById('tripCard');
        card.addEventListener('touchstart', e => startY = e.touches[0].clientY);
        card.addEventListener('touchmove', e => {
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) {
                card.style.transform = `translateY(${diff}px)`;
            }
        });
        card.addEventListener('touchend', () => {
            card.style.transform = `translateY(0px)`;
        });
    </script>
