<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TriRide - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline": "#737686",
                    "inverse-primary": "#b4c5ff",
                    "on-secondary-fixed": "#002113",
                    "on-secondary-fixed-variant": "#005236",
                    "secondary-fixed-dim": "#4edea3",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-tertiary-container": "#ffeedd",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f3f3fe",
                    "surface-container": "#ededf9",
                    "error-container": "#ffdad6",
                    "on-surface-variant": "#434655",
                    "surface": "#faf8ff",
                    "on-secondary-container": "#00714d",
                    "on-surface": "#191b23",
                    "primary-container": "#2563eb",
                    "secondary": "#006c49",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-secondary": "#ffffff",
                    "tertiary": "#784b00",
                    "inverse-on-surface": "#f0f0fb",
                    "primary": "#004ac6",
                    "tertiary-container": "#996100",
                    "surface-tint": "#0053db",
                    "on-tertiary-fixed": "#2a1700",
                    "tertiary-fixed-dim": "#ffb95f",
                    "on-error-container": "#93000a",
                    "secondary-container": "#6cf8bb",
                    "surface-dim": "#d9d9e5",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#003ea8",
                    "secondary-fixed": "#6ffbbe",
                    "surface-container-high": "#e7e7f3",
                    "inverse-surface": "#2e3039",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#ffddb8",
                    "on-primary-container": "#eeefff",
                    "surface-container-highest": "#e1e2ed",
                    "background": "#faf8ff",
                    "surface-variant": "#e1e2ed",
                    "on-primary-fixed": "#00174b",
                    "on-background": "#191b23",
                    "outline-variant": "#c3c6d7",
                    "surface-bright": "#faf8ff",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#dbe1ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "24px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "xs": "4px",
                    "gutter": "16px",
                    "sm": "8px",
                    "base": "8px",
                    "lg": "24px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "body": ["Inter"],
                    "section-title": ["Inter"],
                    "button": ["Inter"],
                    "headline-md": ["Inter"],
                    "nav-label": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "caption": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "body": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "nav-label": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "caption": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .diffusion-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Top Navigation Suppression (Transactional Page Logic Applied) -->
<!-- The TopAppBar and BottomNavBar are suppressed as this is a login screen -->
<main class="w-full max-w-md space-y-xl animate-in fade-in duration-700">
<!-- Branding Header -->
<header class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-xl mb-md">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="directions_car">directions_car</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome Back</h1>
<p class="font-body text-body text-on-surface-variant">Log in to continue your journey with TriRide</p>
</header>
<!-- Login Form -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg diffusion-shadow">
<form action="#" class="space-y-lg" id="loginForm" method="POST">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-button text-caption text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-xl pr-md py-md bg-surface-bright border border-outline-variant rounded-xl text-body focus:ring-2 focus:ring-primary-container focus:border-primary transition-all placeholder:text-outline/50" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-button text-caption text-on-surface-variant" for="password">Password</label>
<a class="font-button text-caption text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-xl pr-12 py-md bg-surface-bright border border-outline-variant rounded-xl text-body focus:ring-2 focus:ring-primary-container focus:border-primary transition-all placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Log In Button -->
<button class="w-full h-14 bg-primary-container text-on-primary-container font-button text-button rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center space-x-sm shadow-sm" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Social Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-caption uppercase">
<span class="bg-surface-container-lowest px-md text-outline">Or continue with</span>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center py-md border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors space-x-sm font-button text-on-surface">
<span class="material-symbols-outlined text-on-surface text-[20px]" data-icon="account_circle">account_circle</span>
<span>Google</span>
</button>
<button class="flex items-center justify-center py-md border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors space-x-sm font-button text-on-surface">
<span class="material-symbols-outlined text-on-surface text-[20px]" data-icon="apple">apps</span>
<span>Apple</span>
</button>
</div>
</div>
<!-- Sign Up Link -->
<footer class="text-center pb-xl">
<p class="font-body text-body text-on-surface-variant">
                Don't have an account? 
                <a class="font-button text-primary hover:underline ml-xs" href="#">Sign Up</a>
</p>
</footer>
</main>
<!-- Background Decoration (Subtle Atmospheric Effects) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none opacity-30">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-fixed-dim rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-secondary-fixed-dim rounded-full blur-[100px]"></div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Lightweight interaction for the form
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined" data-icon="progress_activity">progress_activity</span>`;
            btn.disabled = true;
            
            // Simulating a fast response
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('Authentication system placeholder triggered.');
            }, 1000);
        });
    </script>
</body></html>
