<body class="bg-background text-on-background min-h-screen flex flex-col items-center overflow-hidden">
<!-- Top AppBar (Simplified for Onboarding) -->

<!-- Illustration Section -->
<div class="w-full flex justify-center mb-xl">

<!-- Main Illustration (Responsive Image) -->

<img class="w-56 h-56 object-contain" data-alt="A clean, minimalist 3D isometric illustration of a modern blue tricycle taxi with a sleek canopy. The tricycle is positioned on a stylized white road against a soft pastel blue background. The lighting is bright and professional, typical of high-end tech onboarding interfaces, emphasizing safety and efficiency. The scene is uncluttered, focusing on the vehicle as the hero element with soft ambient shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8sV5gOrKL62QhkFKMrq_oQIGUyvgP5J-2CPJmHgZ7zA090dNNEtk9RKhj3u890_BgSUbSul8bjRR2Xmn9IjiaTIIjVSUE_0nauck0MqfvkUWYgx_9ZnsNY5vf-NXJfZPW2FSVIxL2XFjwCZ400V_KVC3oShl78zjsRyX6plXaQJ6V0bMRrHn1P8XxUIoqaN_3qFekRJh_z5y5q7H_RadZ3VgYITk6zg_F7HDt2H1SE__NRJxx7plIejwhleyAFpPzGUbJrn3-WOo">

                Ride with Ease
            </h1>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mx-auto">
                Affordable and safe tricycle rides for students.
            </p>
</div>
<!-- Feature Pills (Bento-lite style) -->
<div class="mt-xl grid grid-cols-2 gap-sm w-full">
<div class="p-md bg-surface-container rounded-xl border border-outline-variant flex items-center gap-base">
<div class="bg-primary-container/10 p-xs rounded-lg text-primary">
<span class="material-symbols-outlined !text-[20px]">security</span>
</div>
<span class="font-caption text-caption text-on-surface">Verified Drivers</span>
</div>
<div class="p-md bg-surface-container rounded-xl border border-outline-variant flex items-center gap-base">

<span class="material-symbols-outlined !text-[20px]">payments</span>
</div>

</div>
</div>
</main>
<!-- Bottom Actions Container -->
<div class="w-full max-w-md px-margin-mobile pb-xl pt-lg bg-background/80 backdrop-blur-sm z-20">
<div class="flex flex-col gap-md">
<!-- Primary CTA -->
<button class="w-full bg-[#2563EB] text-white font-button text-button h-[56px] rounded-[12px] shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" onclick="handleStart()">
                Get Started

</button>
<!-- Secondary/Tertiary CTA -->
<div class="flex justify-center items-center gap-sm">

</div>
</div>

<div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-secondary-fixed-dim/10 rounded-full blur-[80px]"></div>
</div>
<script>
        function handleStart() {
            // Ripple effect or micro-interaction
            const btn = document.querySelector('button');
            btn.classList.add('scale-95');
            setTimeout(() => {
                btn.classList.remove('scale-95');
                // Potential transition to login or map view
                console.log('Transitioning to main application flow...');
            }, 100);
        }

        // Simple entrance animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-on-load');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = `all 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.1}s`;
                
                requestAnimationFrame(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
