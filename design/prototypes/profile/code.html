<span class="font-nav-label text-nav-label">Profile</span>

<script>
        // Simple interaction for profile list items
        document.querySelectorAll('.profile-list-item').forEach(button => {
            button.addEventListener('click', function() {
                this.classList.add('scale-[0.98]');
                setTimeout(() => {
                    this.classList.remove('scale-[0.98]');
                }, 100);
            });
        });
    </script>
