<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TriRide - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#434655",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-highest": "#e1e2ed",
                        "surface-container": "#ededf9",
                        "secondary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed": "#2a1700",
                        "tertiary-fixed-dim": "#ffb95f",
                        "secondary-fixed": "#6ffbbe",
                        "on-error": "#ffffff",
                        "secondary": "#006c49",
                        "secondary-container": "#6cf8bb",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f0f0fb",
                        "on-tertiary": "#ffffff",
                        "outline": "#737686",
                        "surface-bright": "#faf8ff",
                        "on-secondary-fixed": "#002113",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "surface": "#faf8ff",
                        "on-primary-container": "#eeefff",
                        "background": "#faf8ff",
                        "surface-container-low": "#f3f3fe",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#996100",
                        "surface-container-high": "#e7e7f3",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#00174b",
                        "outline-variant": "#c3c6d7",
                        "on-surface": "#191b23",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-container": "#ffeedd",
                        "surface-tint": "#0053db",
                        "primary": "#004ac6",
                        "primary-container": "#2563eb",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "on-background": "#191b23",
                        "inverse-surface": "#2e3039",
                        "error": "#ba1a1a",
                        "surface-variant": "#e1e2ed",
                        "on-secondary-container": "#00714d",
                        "primary-fixed": "#dbe1ff",
                        "surface-dim": "#d9d9e5",
                        "tertiary": "#784b00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "margin-desktop": "24px",
                        "base": "8px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter": "16px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "caption": ["Inter"],
                        "button": ["Inter"],
                        "section-title": ["Inter"],
                        "nav-label": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body": ["Inter"]
                    },
                    "fontSize": {
                        "caption": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "nav-label": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .diffusion-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 74, 198, 0.08);
        }
        .active-role-shadow {
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.2);
        }
        input:focus {
            outline: none;
            box-shadow: none;
        }
        .role-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body text-body selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
<!-- Hero/Graphic Section (Asymmetric WebGL background) -->
<div class="relative w-full h-[176px] md:h-[265px] overflow-hidden">

<div class="absolute inset-0 flex items-center justify-center">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tighter drop-shadow-sm">
                TriRide
            </h1>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-start justify-center px-margin-mobile -mt-12 relative z-10">
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] p-8 diffusion-shadow border border-outline-variant">
<!-- Header -->
<div class="text-center mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Join the Community</h2>
<p class="font-body text-body text-on-surface-variant">Your reliable campus transportation partner.</p>
</div>
<!-- Role Selector -->
<div class="bg-surface-container-low p-1.5 rounded-[16px] flex mb-8">
<button class="role-transition flex-1 flex items-center justify-center gap-2 py-3 rounded-[12px] font-button text-button bg-primary text-on-primary active-role-shadow" id="role-student" onclick="selectRole('student')">
<span class="material-symbols-outlined text-[20px]">school</span>
                    Student
                </button>
<button class="role-transition flex-1 flex items-center justify-center gap-2 py-3 rounded-[12px] font-button text-button text-on-surface-variant" id="role-driver" onclick="selectRole('driver')">
<span class="material-symbols-outlined text-[20px]">directions_car</span>
                    Driver
                </button>
</div>
<!-- Registration Form -->
<form class="space-y-6" onsubmit="return false;">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-button text-[14px] text-on-surface-variant ml-1" for="full-name">Full Name</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-[12px] font-body text-body text-on-surface focus:border-primary focus:border-2 transition-all" id="full-name" placeholder="John Doe" required="" type="text">
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="font-button text-[14px] text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-[12px] font-body text-body text-on-surface focus:border-primary focus:border-2 transition-all" id="email" placeholder="john@university.edu" required="" type="email">
</div>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="font-button text-[14px] text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">call</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-[12px] font-body text-body text-on-surface focus:border-primary focus:border-2 transition-all" id="phone" placeholder="+1 (555) 000-0000" required="" type="tel">
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="font-button text-[14px] text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-lowest border border-outline-variant rounded-[12px] font-body text-body text-on-surface focus:border-primary focus:border-2 transition-all" id="password" placeholder="Min. 8 characters" required="" type="password">
<button class="absolute right-4 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>
</div>
<!-- Terms -->
<p class="font-caption text-caption text-on-surface-variant text-center px-4">
                    By creating an account, you agree to our <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                </p>
<!-- CTA -->
<button class="w-full bg-primary-container text-on-primary-container font-button text-button py-4 rounded-[12px] hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-8 pt-6 border-t border-outline-variant text-center">
<p class="font-body text-body text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Log in</a>
</p>
</div>
</div>
</main>
<!-- Footer Space -->
<footer class="py-8 text-center">
<p class="font-caption text-caption text-outline">© 2024 TriRide Technologies Inc.</p>
</footer>
<script>
        function selectRole(role) {
            const studentBtn = document.getElementById('role-student');
            const driverBtn = document.getElementById('role-driver');

            if (role === 'student') {
                studentBtn.classList.add('bg-primary', 'text-on-primary', 'active-role-shadow');
                studentBtn.classList.remove('text-on-surface-variant');
                
                driverBtn.classList.remove('bg-primary', 'text-on-primary', 'active-role-shadow');
                driverBtn.classList.add('text-on-surface-variant');
            } else {
                driverBtn.classList.add('bg-primary', 'text-on-primary', 'active-role-shadow');
                driverBtn.classList.remove('text-on-surface-variant');
                
                studentBtn.classList.remove('bg-primary', 'text-on-primary', 'active-role-shadow');
                studentBtn.classList.add('text-on-surface-variant');
            }
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('pass-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }
    </script>
</body></html>
